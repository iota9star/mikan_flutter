name: mikan
description: mikanani.me

version: 2.3.5+98

publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: 4.13.0
  firebase_analytics: ^12.4.6
  firebase_crashlytics: ^5.2.7
  path_provider: ^2.1.6
  hive_ce: ^2.19.0
  hive_ce_flutter: ^2.3.4
  url_launcher: ^6.3.1
  share_plus: ^13.0.0
  flutter_widget_from_html_core: ^0.17.2
  extended_sliver: ^2.1.3
  waterfall_flow: ^3.0.2
  hora: ^2.0.0
  android_intent_plus: ^6.0.0
  connectivity_plus: ^7.3.1
  ff_annotation_route_core: ^2.1.1
  ff_annotation_route_library: ^3.2.3
  sliver_tools: ^0.2.12
  flutter_displaymode: ^0.7.0
  flex_color_picker: ^3.8.0
  intl: ^0.20.2
  collection: ^1.19.0
  path: ^1.9.0
  async: ^2.13.0
  auto_size_text: ^3.0.0
  easy_refresh: ^3.5.0
  window_manager: ^0.5.2
  dynamic_color: ^1.9.0
  decimal: ^3.2.0
  flutter_smart_dialog: ^5.1.0
  infinite_carousel: ^1.0.3
  package_info_plus: ^10.0.0
  animations: ^3.0.0
  vclibs: ^0.1.3
  in_app_update: ^5.0.0
  gap: ^3.0.1
  expressive_loading_indicator: ^0.0.1
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^4.0.3
  hooks_riverpod: ^3.3.0
  fjs: ^3.3.0
  riverpod: ^3.3.0
  kache_riverpod: ^3.0.0
  kache_hive_ce: ^3.0.0
  kache_connectivity_plus: ^3.0.0
  flutter_riverpod: ^3.3.2
  kache: ^3.0.0
  pixa: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  args: ^2.4.1
  yaml: ^3.1.2
  glob: ^2.1.1
  http: ^1.6.0
  process_run: ^1.3.0
  build_runner: ^2.15.0
  flutter_gen: ^5.14.0
  flutter_gen_runner: ^5.14.0
  flutter_lints: ^6.0.0
  quiver: ^3.2.1
  riverpod_generator: ^4.0.0
  riverpod_lint: ^3.1.0
  hive_ce_generator: ^1.11.0
  flutter_cockpit: ^4.0.38

dependency_overrides:
  # fjs 3.3.0 declares ^2.12.0 but its codegen is 2.12.0-only; 2.13.0 runtime
  # aborts startup with a version sanity check. Pin until fjs regenerates.
  flutter_rust_bridge: 2.12.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/js/

flutter_gen:
  output: lib/res/
  line_length: 80
  integrations:
    flutter_svg: true
    rive: true
    lottie: true

